name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure pre-installed Android SDK
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools:$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          yes | "$SDK_DIR/cmdline-tools/16.0/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize Android project & sync offline web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK (Offline & Ad-Free)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Area-Measurement-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
